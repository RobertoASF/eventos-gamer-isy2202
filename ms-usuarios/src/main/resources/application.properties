spring.application.name=ms-usuarios
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gamer_usuarios}
spring.datasource.username=${DB_USUARIO:app_usuarios}
spring.datasource.password=${DB_CLAVE}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5

# Actuator responde en un puerto interno distinto al de la API, solo para el healthcheck de Docker
management.server.port=9081
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

jwt.secreto=${JWT_SECRETO}
jwt.minutos-validez=60

logging.level.cl.duoc.gamer=${LOG_NIVEL:INFO}
