<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Error')}"><title>Eventos Gamer</title></head>
<body>
<header th:replace="~{fragmentos :: menu('')}"></header>

<main class="contenedor error-pagina">
    <p class="error-pagina__codigo" th:text="${status}">404</p>
    <h1 th:switch="${status}">
        <span th:case="404">Página no encontrada</span>
        <span th:case="403">Acceso denegado</span>
        <span th:case="400">Solicitud no válida</span>
        <span th:case="503">Servicio no disponible</span>
        <span th:case="*">Algo salió mal</span>
    </h1>
    <p th:text="${mensaje} ?: 'No pudimos procesar tu solicitud. Vuelve al inicio e inténtalo de nuevo.'">Mensaje</p>
    <a class="boton" th:href="@{/}">Volver al inicio</a>
</main>

<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
