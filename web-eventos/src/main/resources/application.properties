spring.application.name=web-eventos
server.port=8080
server.servlet.context-path=/eventos

# Detras de nginx: toma la IP y el protocolo reales de los encabezados X-Forwarded-*
server.forward-headers-strategy=native

# Sesion: solo por cookie (nunca ;jsessionid en la URL), inaccesible desde JavaScript, enviada solo por HTTPS
# y nunca desde otros sitios
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Las paginas de error no muestran detalles internos
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Las fechas y montos se muestran en formato chileno
spring.web.locale=es_CL
spring.web.locale-resolver=fixed

# Fotos y videos: el limite fino por tipo lo aplica ms-eventos
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
spring.servlet.multipart.file-size-threshold=1MB

# Direccion publica del sitio para los enlaces de compartir. No se arma con el encabezado Host
sitio.url-publica=${SITIO_URL_PUBLICA:https://localhost/eventos}

servicios.usuarios.url=${SERVICIO_USUARIOS_URL:http://localhost:8081}
servicios.eventos.url=${SERVICIO_EVENTOS_URL:http://localhost:8082}

logging.level.cl.duoc.gamer=${LOG_NIVEL:INFO}
