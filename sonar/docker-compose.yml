name: sonarqube

# SonarQube Community Build con PostgreSQL, solo para el equipo de desarrollo.
# La interfaz queda en http://localhost:9100 y no se publica hacia la red (solo 127.0.0.1).

services:
  sonarqube:
    image: sonarqube:26.11.0.134175-community
    restart: unless-stopped
    depends_on:
      basedatos:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://basedatos:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_BD_CLAVE}
      # Docker Desktop no permite subir vm.max_map_count sin tocar la maquina; Elasticsearch funciona sin mmap
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
    ports:
      - "127.0.0.1:9100:9000"
    volumes:
      - sonar-datos:/opt/sonarqube/data
      - sonar-extensiones:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    security_opt:
      - no-new-privileges:true

  basedatos:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_BD_CLAVE}
      POSTGRES_DB: sonar
    volumes:
      - sonar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  sonar-datos:
  sonar-extensiones:
  sonar-logs:
  sonar-postgres:
