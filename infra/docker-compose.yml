name: eventos-gamer

# Solo nginx publica puertos (80 redirige a 443). MySQL y las API quedan en la red interna de Docker.
# Las imagenes usan una version fija para que cada despliegue use exactamente los mismos componentes.

x-servicio-java: &servicio-java
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - interna

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_CLAVE_USUARIOS: ${DB_CLAVE_USUARIOS}
      DB_CLAVE_EVENTOS: ${DB_CLAVE_EVENTOS}
    volumes:
      - ../bd:/docker-entrypoint-initdb.d:ro
      - datos-mysql:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Usa TCP para responder solo cuando terminaron los scripts de la carpeta bd
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1 FROM gamer_eventos.banners LIMIT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - interna

  ms-usuarios:
    <<: *servicio-java
    build: ../ms-usuarios
    environment:
      TZ: America/Santiago
      DB_URL: jdbc:mysql://mysql:3306/gamer_usuarios
      DB_USUARIO: app_usuarios
      DB_CLAVE: ${DB_CLAVE_USUARIOS}
      JWT_SECRETO: ${JWT_SECRETO}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  ms-eventos:
    <<: *servicio-java
    build: ../ms-eventos
    environment:
      TZ: America/Santiago
      DB_URL: jdbc:mysql://mysql:3306/gamer_eventos
      DB_USUARIO: app_eventos
      DB_CLAVE: ${DB_CLAVE_EVENTOS}
      JWT_SECRETO: ${JWT_SECRETO}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web-eventos:
    <<: *servicio-java
    build: ../web-eventos
    environment:
      TZ: America/Santiago
      SERVICIO_USUARIOS_URL: http://ms-usuarios:8081
      SERVICIO_EVENTOS_URL: http://ms-eventos:8082
      SITIO_URL_PUBLICA: ${URL_HTTPS}/eventos
    depends_on:
      ms-usuarios:
        condition: service_healthy
      ms-eventos:
        condition: service_healthy

  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "${PUERTO_HTTPS:-443}:443"
    environment:
      URL_HTTPS: ${URL_HTTPS}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certificados:/etc/nginx/certificados:ro
      - certbot-web:/var/www/certbot:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      - web-eventos
    networks:
      - interna

networks:
  interna:

volumes:
  datos-mysql:
  certbot-web:
