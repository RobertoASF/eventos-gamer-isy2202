spring.application.name=ms-eventos
server.port=8082

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gamer_eventos}
spring.datasource.username=${DB_USUARIO:app_eventos}
spring.datasource.password=${DB_CLAVE}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5

# Actuator responde en un puerto interno distinto al de la API, solo para el healthcheck de Docker
management.server.port=9082
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

jwt.secreto=${JWT_SECRETO}

logging.level.cl.duoc.gamer=${LOG_NIVEL:INFO}

# Fotos (hasta 5 MB) y videos (hasta 25 MB). El tipo y el peso exacto se revisan en ValidadorMultimedia
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
spring.servlet.multipart.file-size-threshold=1MB
