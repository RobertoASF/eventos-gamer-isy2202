spring.application.name=ms-eventos
server.port=8082

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gamer_eventos}
spring.datasource.username=${DB_USUARIO:app_eventos}
spring.datasource.password=${DB_CLAVE}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5

management.endpoints.web.exposure.include=health

jwt.secreto=${JWT_SECRETO}

logging.level.cl.duoc.gamer=${LOG_NIVEL:INFO}
